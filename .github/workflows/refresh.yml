name: refresh-cve-data

# Re-bakes the dataset from NVD + CISA KEV and commits it, so the Pages build
# always serves current data. NVD publishes continuously; hourly is enough.
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cve-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # The cache makes a warm run take seconds; a cold run pages through NVD.
      - name: restore NVD page cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: nvd-cache-${{ github.run_id }}
          restore-keys: nvd-cache-

      - name: build dataset
        env:
          # optional: lifts NVD's rate limit from 5 to 50 requests / 30 s
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # runner IPs get cut off on 500-record pages; 200 is reliably delivered
          NVD_PAGE_SIZE: "200"
        run: node scripts/build_data.mjs

      - name: verify (tier 1)
        run: node scripts/verify_app.js

      - name: commit if the data moved
        run: |
          git config user.name  "ninescope-bot"
          git config user.email "ninescope-bot@users.noreply.github.com"
          if git diff --quiet -- public/data; then
            echo "dataset unchanged — nothing to commit"
            exit 0
          fi
          git add public/data
          git commit -m "data: refresh criticals ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
