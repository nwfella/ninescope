name: refresh-cve-data

# Re-bakes the dataset from NVD + CISA KEV and commits it, so the Pages build
# always serves current data.
#
# An NVD API key is REQUIRED for CI. NVD's keyless limit (5 requests / 30 s) is
# per source IP, and GitHub-hosted runners share heavily-used addresses: a
# keyless run gets throttled, pages are terminated mid-body, and the job crawls
# until it times out. The same build takes ~14 minutes from a residential IP.
# A key is free and instant, and gives 50 requests / 30 s bound to the key:
#   https://nvd.nist.gov/developers/request-an-api-key
#   gh secret set NVD_API_KEY
#
# Without the key the job skips instead of failing — the app shows its own data
# age in the header and the Methodology tab, so staleness stays visible.
on:
  schedule:
    - cron: "17 */6 * * *"      # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cve-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: check for an NVD API key
        id: key
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo "::warning title=Refresh skipped::No NVD_API_KEY secret. Keyless NVD access is limited per source IP and GitHub runner IPs are throttled, so the bake would time out. Add a free key (https://nvd.nist.gov/developers/request-an-api-key) then run: gh secret set NVD_API_KEY"
            echo "have_key=0" >> "$GITHUB_OUTPUT"
          else
            echo "have_key=1" >> "$GITHUB_OUTPUT"
          fi

      # Warm cache makes a re-run take seconds; a cold run pages through NVD.
      - name: restore NVD page cache
        if: steps.key.outputs.have_key == '1'
        uses: actions/cache@v4
        with:
          path: .cache
          key: nvd-cache-${{ github.run_id }}
          restore-keys: nvd-cache-

      - name: build dataset
        if: steps.key.outputs.have_key == '1'
        env:
          # 50 requests / 30 s instead of 5 — required, see the header note
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          NVD_PAGE_SIZE: "500"
        run: node scripts/build_data.mjs

      - name: verify (tier 1)
        if: steps.key.outputs.have_key == '1'
        run: node scripts/verify_app.js

      - name: commit if the data moved
        if: steps.key.outputs.have_key == '1'
        run: |
          git config user.name  "ninescope-bot"
          git config user.email "ninescope-bot@users.noreply.github.com"
          if git diff --quiet -- docs/data; then
            echo "dataset unchanged — nothing to commit"
            exit 0
          fi
          git add docs/data
          git commit -m "data: refresh criticals ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push
